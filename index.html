<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriBalance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1916'/%3E%3Crect x='7' y='14' width='4' height='10' rx='1' fill='%23c6532a'/%3E%3Crect x='14' y='8' width='4' height='16' rx='1' fill='%23f3efe6'/%3E%3Crect x='21' y='11' width='4' height='13' rx='1' fill='%231d6b62'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button type="button" class="brand" data-action="nav" data-view="dashboard">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>TriBalance</strong><small>Estudo, prazos e notas</small></span>
      </button>
      <nav class="nav" aria-label="Principal">
        <button type="button" class="nav-item" data-action="nav" data-view="dashboard"><span class="nav-label">Painel</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="courses"><span class="nav-label">Cadeiras</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="projects"><span class="nav-label">Projetos</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="tasks"><span class="nav-label">Tarefas</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="calendar"><span class="nav-label">Calendário</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="grades"><span class="nav-label">Notas</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="stats"><span class="nav-label">Estatísticas</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="reminders"><span class="nav-label">Lembretes</span> <em class="nav-count" id="nav-alert-count" hidden>0</em></button>
        <button type="button" class="nav-item" data-action="nav" data-view="archive"><span class="nav-label">Arquivo</span></button>
        <button type="button" class="nav-item" data-action="nav" data-view="customize"><span class="nav-label">Personalizar</span></button>
      </nav>
      <div class="side-foot">
        <span id="side-semester">Semestre</span>
        <small id="side-range"></small>
        <small class="privacy">Dados neste computador</small>
      </div>
    </aside>
    <div class="scrim" data-action="close-sidebar"></div>
    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" data-action="menu" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <p class="top-kicker">Organizador académico</p>
        <div class="layout-switch" id="layout-switch" hidden>
          <div class="segment" role="group" aria-label="Vista das tarefas">
            <button type="button" data-action="task-layout" data-layout="list">Lista</button>
            <button type="button" data-action="task-layout" data-layout="kanban">Kanban</button>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="btn btn-ghost btn-sm" data-action="open-session">Registar estudo</button>
          <button type="button" class="icon-btn bell-btn" data-action="nav" data-view="reminders" aria-label="Lembretes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2H4.5z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
            <em class="bell-count" id="bell-count" hidden>0</em>
          </button>
          <button type="button" class="icon-btn" data-action="open-settings" aria-label="Definições do semestre">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.8l1.6 1.6M17.6 15.6l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.2l1.6-1.6M17.6 8.4l1.6-1.6"/></svg>
          </button>
        </div>
      </header>
      <div id="view"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/helpers.js?v=7"></script>
  <script src="js/icons.js?v=7"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/views.js?v=7"></script>
  <script src="js/modals.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script>
    (function () {
      var icons = {
        dashboard: "dashboard",
        courses: "courses",
        projects: "projects",
        tasks: "tasks",
        calendar: "calendar",
        grades: "grades",
        stats: "stats",
        reminders: "bell",
        archive: "archive",
        customize: "customize"
      };
      document.querySelectorAll(".nav-item").forEach(function (button) {
        var name = icons[button.dataset.view];
        if (!name || !window.Icons) return;
        button.insertAdjacentHTML("afterbegin", Icons.ui(name));
      });
    })();
  </script>
</body>
</html>
